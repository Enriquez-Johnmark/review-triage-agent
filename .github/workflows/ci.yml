name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A3: no real review data is ever committed.
      - run: pnpm check:data

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      # The browser test: the main journey against the real server and the demo.
      # The runner image already has Chromium's libraries; the extra system
      # packages come from Ubuntu's mirror, which can be unreachable, so they
      # are tried for two minutes at most.
      - run: timeout 120 pnpm --dir web exec playwright install-deps chromium || echo "::warning::couldn't install Chromium's extra system packages; trying without them"
      - run: pnpm --dir web exec playwright install chromium
      - run: pnpm --dir web e2e
